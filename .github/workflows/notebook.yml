name: Notebook portability
on: [push, pull_request]
jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: notebook/requirements.txt
      - run: python -m pip install -r notebook/requirements.txt
      - run: python -m unittest discover -s notebook -p "test_*.py" -v
      - name: Check first-use setup and reuse
        if: matrix.python == '3.11'
        run: |
          python notebook/setup_env.py
          python notebook/setup_env.py
